[project]
name = "scouts-passport"
version = "0.2.0"
description = "Fill Scouts Canada Cub passports from ScoutsTracker"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "playwright>=1.45",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
# Leaders' installs don't need pytest; CI/maintainers use: uv sync --group dev
default-groups = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
